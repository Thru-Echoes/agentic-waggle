[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC
truncate_slug_length = 40
output_encoding = utf-8

# The real URL is read from DATABASE_URL in env.py; this placeholder is only
# used if alembic is invoked without the env var, which would fail anyway.
sqlalchemy.url = postgresql://agentic_mcp_crm:agentic_mcp_crm@postgres:5432/agentic_mcp_crm


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
