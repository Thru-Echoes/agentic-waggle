# Waggle — project metadata, locked dependencies, and tool configuration.
#
# Dependencies are resolved into `uv.lock` (universal, hashed). The Dockerfile
# and CI install from the lock (`uv sync --frozen`), so the versions that run
# in production are the versions that were tested. Edit this file, then run
# `make lock` to refresh the lock.
#
# torch comes from the CPU-only PyTorch index on Linux so the container image
# does not pull CUDA libraries it cannot use (several GB). macOS and Windows
# resolve torch from PyPI as usual.

[project]
name = "waggle"
version = "0.1.0"
description = "Agentic CRM over a synthetic commercial-beekeeping domain (FastAPI + LangGraph + MCP + pgvector)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  # Core data + typing
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "python-dateutil>=2.9",
  # Database + ORM + migrations. psycopg2 is the only PostgreSQL driver
  # shipped; every engine URL names it explicitly (see db/url.py).
  "sqlalchemy>=2.0",
  "sqlmodel>=0.0.16",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pgvector>=0.3",
  # FastAPI app layer
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "httpx>=0.27",
  # Seed + fixtures
  "faker>=25.0",
  # Local embeddings + vector search
  "sentence-transformers>=2.5",
  "torch>=2.2",
  "numpy>=1.26",
  # LLM — required at runtime (no canned fallback); see providers/llm.py
  "anthropic>=0.40",
  "openai>=1.30",
  # LangGraph-backed extraction agent
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  # Model Context Protocol servers
  "mcp>=1.0",
  "fastmcp>=0.4",
  # Reserved for background work and multi-instance rate limiting; unused today
  "redis>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "anyio>=4.0",
  # Browser-driven E2E (Layer 2 of .claude/rules/ui-verification.md).
  # The Chromium binary is installed separately: `uv run playwright install chromium`.
  "playwright>=1.50",
  "pytest-playwright>=0.7",
  "pyright>=1.1.400",
  "ruff>=0.9",
  "pip-audit>=2.7",
]

[tool.uv]
# Waggle is an application, not an installable package: there is no build
# backend and `uv sync` installs only the dependencies.
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "docs", "alembic/versions"]

[tool.ruff.lint]
# Default rule set (pyflakes + the pycodestyle E4/E7/E9 subset). Tightened
# deliberately only once the baseline is clean; CI fails on any finding.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]
