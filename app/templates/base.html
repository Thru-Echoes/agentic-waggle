<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/waggle.css">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  {# HTMX is vendored (no third-party script origin) and runs under the
     per-request CSP nonce. allowEval off: no hx-vals='js:' or hx-on in
     use. includeIndicatorStyles off: the indicator rules live in waggle.css
     so HTMX does not inject an inline <style>, which the CSP would block. #}
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
  <script src="/static/htmx.min.js" nonce="{{ csp_nonce }}"></script>
  <script nonce="{{ csp_nonce }}">
    // Swap 4xx/5xx responses into the page. HTMX 1.x ignores error
    // responses by default, which left a failed Extract looking like
    // nothing happened; the server returns an error card for them.
    document.addEventListener('htmx:beforeSwap', function (evt) {
      var xhr = evt.detail && evt.detail.xhr;
      if (xhr && xhr.status >= 400) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
    });
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="/">
        <span class="brand-mark">
          <img src="/static/logo.svg" width="36" height="36" alt="{{ product }}">
        </span>
        <span class="brand-name">{{ product }}</span>
        <span class="brand-tagline">{{ tagline }}</span>
      </a>
      <nav class="primary">
        <a href="/" class="{{ 'active' if nav == 'dashboard' else '' }}">Dashboard</a>
        <a href="/copilot" class="{{ 'active' if nav == 'copilot' else '' }}">Copilot</a>
        <a href="/inbox" class="{{ 'active' if nav == 'inbox' else '' }}">Inbox</a>
        <a href="/customers" class="{{ 'active' if nav == 'customers' else '' }}">Customers</a>
        <a href="/orders" class="{{ 'active' if nav == 'orders' else '' }}">Orders</a>
        <a href="/customer-reports" class="{{ 'active' if nav == 'customer_reports' else '' }}">Customer reports</a>
        <a href="/erp-log" class="{{ 'active' if nav == 'erp_log' else '' }}">ERP log</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <strong>{{ product }}</strong> · {{ company }}
    · <span class="muted">synthetic demo data; the company and every customer are fictional</span>
    · <a href="/docs">API docs</a>
  </footer>
</body>
</html>
