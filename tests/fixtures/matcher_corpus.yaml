# Semantic-matcher eval corpus.
#
# Each case:
#   input: the user's free-text reference (typed or dictated)
#   expected_customer_name: canonical name from seed/customers.py — OR null
#   expected_alternatives_min: optional, int — for ambiguous cases
#   expected_sku_kind: "product" | "service" | null — SKU cases only
#   expected_sku_code: SKU code string — SKU cases only
#   category: one of the 24 spec categories
#   context: optional dict with active_account_name, last_3_customer_names
#
# Categories and minimum case counts:
#   canonical(10), abbreviation(10), possessive(8), alias(10),
#   apostrophe_variant(6), site_reference(12), site_shortform(8),
#   typo_resolvable(10), long_form_sentence(15), pronoun_resolution(10),
#   cross_customer_collision(10), ambiguous_reference(10), negative_case(10),
#   generic_words(8), compound_reference(8), casual_colloquial(8),
#   partial_match_noise(6), sku_canonical_code(10), sku_product_name(10),
#   sku_qty_plus_product(10), sku_service(6), sku_colloquial(8),
#   sku_ambiguous(6), sku_negative(6)
# Total: ~246 cases.

