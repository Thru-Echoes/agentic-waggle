# fly.toml app configuration file generated for waggle on 2026-05-05T14:13:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'waggle'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# The demo sees at most a visitor or two at a time and is idle most days, so
# the proxy suspends the machine when no requests arrive and resumes it on the
# next one. A suspended machine bills only its root filesystem. Resume from the
# suspend snapshot takes under a second; the snapshot is discarded by a deploy
# or host maintenance, after which the next request waits for a full cold start
# (migrations plus the embedding-model load, about half a minute).
[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'waggle_data'
  destination = '/data'

# Suspend requires 2 GB or less. Steady state is under 1 GB with the embedding
# model loaded; the headroom covers seeding and reindexing on a fresh volume.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
