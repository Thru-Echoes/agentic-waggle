# fly.toml app configuration file generated for waggle on 2026-05-05T14:13:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'waggle'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'waggle_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
